<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mobile Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>

        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
        body{background:#0f172a;height:100vh;height:100dvh;display:flex;justify-content:center;}
        #mobile-dashboard-view{display:flex !important;position:relative;width:100%;max-width:500px;height:100vh;height:100dvh;}

#mobile-dashboard-view{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:#0f172a;z-index:60;flex-direction:column}
        .mobile-header-bar{padding:12px 15px;display:flex;align-items:center;gap:10px;background:#1e293b}
        .mobile-back-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
        .mobile-search-box{flex:1;display:flex;align-items:center;gap:8px;background:#334155;border-radius:20px;padding:8px 12px;color:#94a3b8}
        .mobile-search-box input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:13px}
        .mobile-dashboard-body{flex:1;padding:20px 15px;position:relative;overflow-y:auto}
        .app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
        .app-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
        .app-icon{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}
        .app-label{font-size:10px;color:#cbd5e1;font-weight:500;text-align:center}
        .app-drawer-panel{position:absolute;bottom:-100%;left:0;width:100%;height:75%;background:#1e293b;border-radius:20px 20px 0 0;padding:12px 15px 20px 15px;transition:bottom 0.35s ease;z-index:5;overflow-y:auto}
        .app-drawer-panel.open{bottom:0}
        .drawer-handle{width:40px;height:4px;background:#475569;border-radius:2px;margin:0 auto 12px auto}
    
        /* ===== GROUP CHAT VIEW - Like reference image ===== */
        
#recent-apps-overlay{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.95);backdrop-filter:blur(12px);z-index:70;flex-direction:column;justify-content:space-between;padding:40px 20px 20px 20px}
        .recent-apps-title{color:#fff;font-size:16px;font-weight:bold;text-align:center;letter-spacing:0.5px}
        .recent-cards-container{display:flex;gap:15px;overflow-x:auto;padding:20px 10px;align-items:center;height:70%;scroll-snap-type:x mandatory}
        .recent-card{min-width:200px;height:320px;background:#ffffff;border-radius:18px;box-shadow:0 10px 25px rgba(0,0,0,0.5);display:flex;flex-direction:column;overflow:hidden;position:relative;cursor:pointer;transition:transform 0.3s ease,opacity 0.3s ease;scroll-snap-align:center}
        .recent-card-header{padding:10px 12px;background:#f1f5f9;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e2e8f0}
        .recent-card-title{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#334155}
        .recent-card-close{color:#94a3b8;cursor:pointer}
        .recent-card-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#94a3b8;font-size:12px}
        .cr-room-list{display:flex;flex-direction:column;gap:10px;width:100%}
        .duck-room-card{background:#fff;border-radius:14px;padding:12px;border:1px solid #e5e7eb;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
        .duck-top{display:flex;gap:10px}
        .duck-avatar{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#7c5cf0,#3b82f6);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0;background-size:cover;background-position:center}
        .duck-main{flex:1;min-width:0}
        .duck-name-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
        .duck-name{font-size:14px;font-weight:700;color:#1f2937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .duck-count{font-size:11px;color:#6b7280;background:#f1f5f9;padding:3px 7px;border-radius:999px;display:flex;align-items:center;gap:4px;flex-shrink:0}
        .duck-desc{font-size:12px;color:#6b7280;margin-top:3px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .duck-topics{font-size:11px;color:#94a3b8;margin-top:4px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
        .duck-topics i{color:#7c6ee6;font-size:11px}
        .duck-topics b{color:#6b7280;font-weight:600;font-size:11px}
        .duck-topic-dot{width:3px;height:3px;background:#cbd5e1;border-radius:50%;display:inline-block}
        .duck-actions{display:flex;align-items:center;gap:8px;margin-top:10px}
        .duck-join{flex:1;background:linear-gradient(90deg,#7c5cf0,#3b82f6);color:#fff;border:none;border-radius:999px;padding:11px 14px;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:0 4px 12px rgba(124,92,240,0.28)}
        .duck-join:active{transform:scale(0.98)}
        .duck-icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid #e5e7eb;background:#fff;display:flex;align-items:center;justify-content:center;color:#9ca3af;cursor:pointer;flex-shrink:0}
        .create-room-tab{display:none;position:absolute;bottom:12px;left:12px;right:12px;z-index:5}
        .create-room-tab.active{display:block}
        .create-room-btn{width:100%;padding:13px;background:linear-gradient(90deg,#3b82f6,#7c5cf0);color:#fff;border:none;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 6px 16px rgba(59,130,246,0.35);display:flex;align-items:center;justify-content:center;gap:8px}
        .cr-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:none;align-items:flex-end;justify-content:center;z-index:200;padding:0}
        .cr-modal-overlay.active{display:flex}
        .cr-modal{background:#fff;width:100%;max-width:500px;border-radius:20px 20px 0 0;max-height:90vh;overflow-y:auto;animation:slideUp .25s ease}
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .cr-header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #e5e7eb;position:sticky;top:0;background:#fff;z-index:1;border-radius:20px 20px 0 0}
        .cr-header h3{font-size:16px;color:#1f2937}
        .cr-close{width:30px;height:30px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;color:#64748b;cursor:pointer}
        .cr-body{padding:16px 18px 18px 18px;display:flex;flex-direction:column;gap:14px}
        .cr-label{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:#374151;margin-bottom:6px}
        .cr-label .optional{color:#9ca3af;font-weight:400}
        .cr-input{width:100%;padding:11px 12px;border:1px solid #e5e7eb;border-radius:10px;font-size:13px;outline:none}
        .cr-input:focus{border-color:#3b82f6}
        .cr-icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
        .cr-icon-item{width:100%;aspect-ratio:1;border:1px solid #e5e7eb;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;background
.mobile-sys-nav{display:none;justify-content:space-around;background-color:#ffffff;border-top:1px solid #e2e8f0;padding:12px 0;position:sticky;bottom:0;z-index:10}
        .sys-btn{display:flex;align-items:center;justify-content:center;color:#718096;cursor:pointer;width:30%;padding:4px;transition:color 0.2s,transform 0.1s}
        .triangle-icon{width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-right:14px solid #718096;border-radius:2px}
        .circle-icon{width:18px;height:18px;border:2px solid #718096;border-radius:50%;display:flex;align-items:center;justify-content:center}
        .circle-icon::after{content:'';width:10px;height:10px;background-color:#718096;border-radius:50%}
        .square-icon{width:14px;height:14px;background-color:#718096;border-radius:2px}
        #recent-apps-overlay{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.95);backdrop-filter:blur(12px);z-index:70;flex-direction:column;justify-content:space-between;padding:40px 20px 20px 20px}

</style>
</head>
<body>
<div id="mobile-dashboard-view">
            <div class="mobile-header-bar"><div class="mobile-back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i></div><div class="mobile-search-box"><i class="fa-solid fa-magnifying-glass"></i><input type="text" placeholder="Search apps" oninput="filterApps(this.value)"></div></div>
            <div class="mobile-dashboard-body">
                <div class="app-grid" id="appGrid">
                    <div class="app-item" data-name="rooms" onclick="launchApp('rooms')"><div class="app-icon" style="background:linear-gradient(135deg,#3b82f6,#7c5cf0)"><i class="fa-solid fa-house"></i></div><div class="app-label">Rooms</div></div>
                    <div class="app-item" data-name="messages" onclick="launchApp('messages')"><div class="app-icon" style="background:linear-gradient(135deg,#10b981,#06b6d4)"><i class="fa-solid fa-message"></i></div><div class="app-label">Messages</div></div>
                    <div class="app-item" data-name="people" onclick="launchApp('people')"><div class="app-icon" style="background:linear-gradient(135deg,#f59e0b,#ef4444)"><i class="fa-solid fa-users"></i></div><div class="app-label">People</div></div>
                    <div class="app-item" data-name="explore" onclick="launchApp('explore')"><div class="app-icon" style="background:linear-gradient(135deg,#8b5cf6,#ec4899)"><i class="fa-solid fa-compass"></i></div><div class="app-label">Explore</div></div>
                    <div class="app-item" data-name="profile" onclick="alert('Profile')"><div class="app-icon" style="background:linear-gradient(135deg,#6366f1,#3b82f6)"><i class="fa-solid fa-user"></i></div><div class="app-label">Profile</div></div>
                    <div class="app-item" data-name="random_chat" onclick="window.location.href='randomchat.html'"><div class="app-icon" style="background:linear-gradient(135deg,#f97316,#eab308)"><i class="fa-solid fa-shuffle"></i></div><div class="app-label">Random Chat</div></div>
                    <div class="app-item" data-name="apps" onclick="alert('Apps')"><div class="app-icon" style="background:linear-gradient(135deg,#06b6d4,#10b981)"><i class="fa-solid fa-mobile-screen-button"></i></div><div class="app-label">Apps</div></div>
                    <div class="app-item" data-name="games" onclick="alert('Games')"><div class="app-icon" style="background:linear-gradient(135deg,#ef4444,#f97316)"><i class="fa-solid fa-gamepad"></i></div><div class="app-label">Games</div></div>
                </div>
            </div>
</div>

<script>
function goBack(){ window.location.href='index.html'; }
function filterApps(txt){
    const q=txt.toLowerCase();
    document.querySelectorAll('#appGrid .app-item').forEach(item=>{
        const name=item.getAttribute('data-name')||'';
        item.style.display = name.includes(q) ? 'flex' : 'none';
    });
}
function launchApp(pageName){
    // In standalone dashboard, redirect back to index with param
    localStorage.setItem('launchPage', pageName);
    window.location.href='index.html?app='+pageName;
}
</script>
</body>
