<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Messages - Standalone</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;user-select:none}
body{background:#f2f2f2;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;max-width:500px;margin:0 auto;width:100%;position:relative}

/* ===== MESSAGE INBOX CSS ===== */
#view-messages{flex:1;display:flex;flex-direction:column;height:100%;background:#f2f2f2;overflow:hidden}
.msg-inbox-wrap{flex:1;display:flex;flex-direction:column;background:#f2f2f2;overflow-y:auto}
.y99-room{display:flex;align-items:center;gap:10px;background:#fff;padding:11px 12px;cursor:pointer;border-bottom:1px solid #f2f2f2;transition:background 0.15s}
.y99-room:last-child{border-bottom:none}
.y99-room:active{background:#f8fafc}
.y99-room-icon{width:44px;height:44px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff}
.y99-room-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.y99-room-top{display:flex;justify-content:space-between;align-items:center}
.y99-room-name{font-size:13.5px;font-weight:700;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%;display:flex;align-items:center;gap:6px}
.y99-room-time{font-size:11px;color:#3b82f6;flex-shrink:0}
.y99-room-last{font-size:11.5px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== CHAT VIEW ===== */
#y99ChatView{display:none;position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;height:100vh;height:100dvh;background:#f2f2f2;z-index:3000;flex-direction:column}
#y99ChatView.active{display:flex}
.y99-chat-header{background:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #e5e7eb}
.y99-chat-back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#333;border-radius:50%}
.y99-chat-back:active{background:#f1f5f9}
.y99-chat-avatar{width:38px;height:38px;border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.y99-chat-info{flex:1;min-width:0}
.y99-chat-name{font-size:13.5px;font-weight:700;color:#111}
.y99-chat-sub{font-size:11px;color:#22c55e}
.y99-chat-messages{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:10px;background:#eef2f5;background-image: radial-gradient(#e0e0e0 1px, transparent 1px);background-size:20px 20px}
.y99-msg-row{display:flex;gap:8px;align-items:flex-end;animation:y99Pop 0.25s ease}
@keyframes y99Pop{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
.y99-msg-avatar{width:30px;height:30px;border-radius:50%;background:#3b82f6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.y99-msg-avatar.bot{background:#4caf50}
.y99-msg-bubble{background:#fff;padding:9px 12px;border-radius:16px;border-bottom-left-radius:4px;max-width:78%;font-size:13px;color:#222;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,0.04);border:1px solid #f0f0f0;word-break:break-word}
.y99-msg-time{font-size:10px;color:#999;margin-top:3px}
.y99-typing{display:flex;gap:5px;align-items:center;padding:10px 14px;background:#fff;border-radius:16px;width:fit-content;box-shadow:0 1px 1px rgba(0,0,0,0.04);border:1px solid #f0f0f0}
.y99-typing span{width:6px;height:6px;background:#aaa;border-radius:50%;display:inline-block;animation:y99Bounce 1.2s infinite}
.y99-typing span:nth-child(2){animation-delay:0.15s}
.y99-typing span:nth-child(3){animation-delay:0.3s}
@keyframes y99Bounce{0%,80%,100%{transform:scale(0.7);opacity:0.5}40%{transform:scale(1);opacity:1}}

/* Input bar - original but disabled look */
.gc-input-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border-top:1px solid #e5e7eb}
.gc-input-wrap{flex:1;display:flex;align-items:center;background:#f1f5f9;border:1px solid #e5e7eb;border-radius:24px;padding:6px 12px}
.gc-input-wrap input{flex:1;background:transparent;border:none;outline:none;font-size:13px}
.gc-send-btn{width:36px;height:36px;border-radius:50%;background:#3b82f6;color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
</style>
</head>
<body>

<div id="view-messages">
    <div class="msg-inbox-wrap">
        <!-- PENDING -->
        <div style="padding:10px 12px 6px 12px;font-size:11px;font-weight:800;color:#666;letter-spacing:0.6px;background:#f2f2f2;">PENDING CONVERSATIONS</div>
        <div id="pendingList" style="background:#fff;display:flex;flex-direction:column;border-top:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;"></div>

        <!-- YOUR CONVERSATIONS -->
        <div style="padding:10px 12px 6px 12px;font-size:11px;font-weight:800;color:#666;letter-spacing:0.6px;background:#f2f2f2;">YOUR CONVERSATIONS</div>
        <div id="yourList" style="background:#fff;display:flex;flex-direction:column;border-top:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;flex:1;">
            <div id="yourEmpty" style="padding:18px;text-align:center;color:#9ca3af;font-size:12px;">No conversations yet<br><span style="font-size:11px;">Read pending messages to move here</span></div>
        </div>
    </div>
</div>

<!-- Chat View -->
<div id="y99ChatView">
    <div class="y99-chat-header">
        <div class="y99-chat-back" onclick="closeY99Chat()"><i class="fa-solid fa-arrow-left"></i></div>
        <div class="y99-chat-avatar" id="y99ChatAvatar" style="background:linear-gradient(135deg,#3b82f6,#7c5cf0)"><i class="fa-solid fa-bell"></i></div>
        <div class="y99-chat-info">
            <div class="y99-chat-name" id="y99ChatName">Notification_Bot!</div>
            <div class="y99-chat-sub" id="y99ChatSub">Online</div>
        </div>
    </div>
    <div class="y99-chat-messages" id="y99ChatMessages"></div>
    <div class="gc-input-bar" style="opacity:0.7;">
        <div class="gc-input-wrap" style="background:#e5e7eb;">
            <input type="text" id="y99Input" placeholder="Disabled Chat" disabled style="flex:1;background:transparent;border:none;outline:none;font-size:13px;color:#9ca3af;cursor:not-allowed;" />
        </div>
        <button class="gc-send-btn" disabled style="opacity:0.4;cursor:not-allowed;background:#9ca3af;"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
</div>

<script>
function escapeHtml(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
function getTimeStr(){ const now=new Date(); let h=now.getHours(); const m=now.getMinutes().toString().padStart(2,'0'); const am=h>=12?'PM':'AM'; h=h%12||12; return h+':'+m+' '+am; }

// ===== FINAL LOGIC: 1 PENDING ONLY, AUTO MOVE, SEND ONCE =====
let pendingRooms = JSON.parse(localStorage.getItem('pendingRooms') || 'null');
if(!pendingRooms){
    pendingRooms = [{id:'notif_bot', name:"Notification_Bot!", last:"Please verify your email...", time:"now", color:"linear-gradient(135deg,#3b82f6,#7c5cf0)", unread:true}];
    localStorage.setItem('pendingRooms', JSON.stringify(pendingRooms));
}
let yourRooms = JSON.parse(localStorage.getItem('yourConversations') || '[]');
const botTexts = [
    "Please Verify your email, <go in manu profile and verify your email>",
    "Go to setting for set your sounds system and our suggestions if you are girl off your pm in setting",
    "Thanks for reading our important messages"
];
let chatHistory = JSON.parse(localStorage.getItem('notifChatHistory') || '[]');
let hasBotSent = localStorage.getItem('botHasSent') === 'true';

function renderLists(){
    const pendingEl = document.getElementById('pendingList');
    const yourEl = document.getElementById('yourList');
    const yourEmpty = document.getElementById('yourEmpty');
    if(!pendingEl || !yourEl) return;
    pendingEl.innerHTML = '';
    if(pendingRooms.length===0){
        pendingEl.innerHTML = '<div style="padding:12px;text-align:center;color:#aaa;font-size:12px;">No pending</div>';
    } else {
        pendingRooms.forEach(room=>{
            const d=document.createElement('div');
            d.className='y99-room';
            d.onclick=()=> openY99Chat(room,'pending');
            d.innerHTML=`<div class="y99-room-icon" style="background:${room.color}"><i class="fa-solid fa-bell"></i></div>
                <div class="y99-room-main"><div class="y99-room-top"><div class="y99-room-name">${room.name}</div><div class="y99-room-time">${room.time}</div></div><div class="y99-room-last">${room.last}</div></div>
                ${room.unread?'<div style="width:8px;height:8px;background:#3b82f6;border-radius:50%;"></div>':''}`;
            pendingEl.appendChild(d);
        });
    }
    // your list
    yourEl.querySelectorAll('.y99-room').forEach(e=>e.remove());
    if(yourRooms.length===0){
        if(yourEmpty) yourEmpty.style.display='block';
    } else {
        if(yourEmpty) yourEmpty.style.display='none';
        yourRooms.forEach(room=>{
            const d=document.createElement('div');
            d.className='y99-room';
            d.onclick=()=> openY99Chat(room,'your');
            d.innerHTML=`<div class="y99-room-icon" style="background:${room.color}"><i class="fa-solid fa-bell"></i></div>
                <div class="y99-room-main"><div class="y99-room-top"><div class="y99-room-name">${room.name}</div><div class="y99-room-time">${room.time}</div></div><div class="y99-room-last">${room.last}</div></div>`;
            yourEl.appendChild(d);
        });
    }
}

function openY99Chat(room, from){
    document.getElementById('y99ChatView').classList.add('active');
    document.getElementById('y99ChatName').innerText = room.name;
    const msgContainer = document.getElementById('y99ChatMessages');
    msgContainer.innerHTML='';

    if(hasBotSent && chatHistory.length>0){
        document.getElementById('y99ChatSub').innerText='';
        chatHistory.forEach(m=>{
            addY99Message(m.sender, m.text, m.time, false);
        });
        if(from==='pending'){
            moveToYour();
        }
        return;
    }

    document.getElementById('y99ChatSub').innerText='typing...';
    let delay=400;
    botTexts.forEach((txt, idx)=>{
        setTimeout(()=> showY99Typing(), delay-200);
        setTimeout(()=>{
            hideY99Typing();
            const timeStr = getTimeStr();
            addY99Message('bot', txt, timeStr, true);
            if(idx===botTexts.length-1){
                document.getElementById('y99ChatSub').innerText='';
                hasBotSent=true;
                localStorage.setItem('botHasSent','true');
                if(from==='pending') moveToYour();
            }
        }, delay);
        delay+=1300;
    });
}

function moveToYour(){
    if(pendingRooms.length===0) return;
    const room = pendingRooms[0];
    pendingRooms=[];
    localStorage.setItem('pendingRooms', JSON.stringify(pendingRooms));
    if(!yourRooms.find(r=>r.id===room.id)){
        yourRooms.unshift({id:room.id, name:room.name, last:botTexts[botTexts.length-1], time:getTimeStr(), color:room.color});
        localStorage.setItem('yourConversations', JSON.stringify(yourRooms));
    }
    setTimeout(renderLists, 600);
}

function closeY99Chat(){
    document.getElementById('y99ChatView').classList.remove('active');
    renderLists();
}

function addY99Message(sender, text, timeStr, save){
    const container=document.getElementById('y99ChatMessages');
    const row=document.createElement('div');
    row.className='y99-msg-row';
    row.innerHTML=`<div class="y99-msg-avatar ${sender==='bot'?'bot':''}">${sender==='bot'?'<i class="fa-solid fa-robot"></i>':'U'}</div>
        <div style="display:flex;flex-direction:column;gap:2px;max-width:80%"><div class="y99-msg-bubble">${escapeHtml(text)}</div><div class="y99-msg-time">${timeStr}</div></div>`;
    container.appendChild(row);
    container.scrollTop=container.scrollHeight;
    if(save){
        chatHistory.push({sender, text, time:timeStr});
        localStorage.setItem('notifChatHistory', JSON.stringify(chatHistory));
    }
}

function showY99Typing(){
    const c=document.getElementById('y99ChatMessages');
    hideY99Typing();
    const t=document.createElement('div');
    t.id='y99Typing';
    t.className='y99-msg-row';
    t.innerHTML=`<div class="y99-msg-avatar bot"><i class="fa-solid fa-robot"></i></div><div class="y99-typing"><span></span><span></span><span></span></div>`;
    c.appendChild(t);
    c.scrollTop=c.scrollHeight;
}
function hideY99Typing(){ const t=document.getElementById('y99Typing'); if(t) t.remove(); }

setTimeout(renderLists, 200);
</script>
</body>
</html>
